[project]
name = "breathewise-backend"
version = "1.0.0"
description = "BreatheWise AI: FastAPI backend for the urban air quality assistant"
requires-python = ">=3.12"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]



[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's File()/Form()/Query() defaults are the documented pattern, not a bug.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query"]
