[project]
name = "breathewise-backend"
version = "1.0.0"
description = "BreatheWise AI: FastAPI backend for the urban air quality assistant"
requires-python = ">=3.12"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM",  # pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify
  "C4", "PIE", "RET", "PERF", "RUF",     # idioms and performance
  "N", "ANN", "ARG",                     # naming, annotations, unused arguments
  "ASYNC", "S", "LOG", "G",              # async pitfalls, bandit security checks, logging
]
ignore = [
  "ANN401",                    # Any is deliberate for raw JSON payloads from upstream APIs
  "RUF001", "RUF002", "RUF003", # Hindi text and units (µ, ≈, —) are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "ANN", "ARG"]  # asserts, fake secrets and untyped fixtures are fine in tests
"../api/**" = ["E402", "S108"]
"api/**" = ["E402", "S108"]
[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = [
    "ignore:unclosed database in <sqlite3.Connection object:ResourceWarning",
    "ignore:Exception ignored while finalizing database connection:pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "pragma: no cover"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.ruff.lint.flake8-bugbear]
# FastAPI's File()/Form()/Query() defaults are the documented pattern, not a bug.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query"]
